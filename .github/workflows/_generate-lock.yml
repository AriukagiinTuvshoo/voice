name: Generate npm lockfile
on:
  push:
    branches: [phase-4-cloud-speech]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-cloud-speech
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; nothing to do."
            exit 0
          fi
          npm install --package-lock-only
          npm ci
      - run: |
          if [ -f package-lock.json ] && git status --short | grep -q '^?? package-lock.json$'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add generated npm lockfile"
            git push origin HEAD:phase-4-cloud-speech
          fi
